name: kaarigar
description: "Kaarigar - artisans publish handmade products by speaking"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  camera: ^0.12.1
  record: ^7.1.1
  just_audio: ^0.10.6
  connectivity_plus: ^7.3.1
  image: ^4.9.2
  uuid: ^4.6.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  generate: true

  assets:
    - assets/mock/
    - assets/icons/
    - assets/images/
    - assets/images/crafts/
    - assets/audio/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VF.ttf
